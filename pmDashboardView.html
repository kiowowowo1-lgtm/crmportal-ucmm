<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRM Portal - Page Manager Dashboard</title>
  <style>
    /* 
      ========================================================================
      STYLING & DESIGN SYSTEM (Page Manager Leads View)
      ========================================================================
    */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f9; color: #333; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background-color: #1F4E78; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; }
    .user-info { font-size: 14px; opacity: 0.9; }

    .container { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; }

    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .status-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { padding: 8px 16px; border: 1px solid #cccccc; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 500; }
    .tab-btn.active { background-color: #1F4E78; color: white; border-color: #1F4E78; }

    .btn-primary { background-color: #28a745; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-primary:hover { background-color: #218838; }

    .table-card { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th, td { padding: 12px 15px; border-bottom: 1px solid #eeeeee; }
    th { background-color: #f8f9fa; color: #555; font-weight: 600; }
    tr:hover { background-color: #f1f5f9; }

    .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .badge-New { background-color: #e3f2fd; color: #0d47a1; }
    .badge-In_Progress { background-color: #fff3cd; color: #856404; }
    .badge-Converted { background-color: #d4edda; color: #155724; }
    .badge-Closed { background-color: #f8d7da; color: #721c24; }

    .status-select { padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 13px; }

    /* Modal Overlay */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
    .modal-card { background: white; padding: 25px; border-radius: 10px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .modal-header h2 { font-size: 18px; color: #1F4E78; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #888; }
    
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 8px 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; }

    .alert { padding: 10px; border-radius: 5px; font-size: 13px; margin-bottom: 15px; display: none; }
    .alert-danger { background-color: #f8d7da; color: #721c24; }
    .alert-success { background-color: #d4edda; color: #155724; }
  </style>
</head>
<body>

  <header>
    <h1>CRM Portal - Page Manager Dashboard</h1>
    <div class="user-info" id="userInfo">Nagloload ng user...</div>
  </header>

  <div class="container">
    <div class="action-bar">
      <div class="status-tabs">
        <button class="tab-btn active" onclick="filterTab('ALL', this)">Lahat</button>
        <button class="tab-btn" onclick="filterTab('New', this)">New</button>
        <button class="tab-btn" onclick="filterTab('In Progress', this)">In Progress</button>
        <button class="tab-btn" onclick="filterTab('Converted', this)">Converted</button>
        <button class="tab-btn" onclick="filterTab('Closed', this)">Closed</button>
      </div>
      <button class="btn-primary" onclick="openLeadModal()">+ Magdagdag ng Lead</button>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Lead ID</th>
            <th>Customer Name</th>
            <th>Contact</th>
            <th>Car / Model</th>
            <th>Service</th>
            <th>Status</th>
            <th>Aksyon</th>
          </tr>
        </thead>
        <tbody id="leadsTableBody">
          <tr><td colspan="7" style="text-align: center; color: #888;">Naglo-load ng Leads...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal Form para sa Paglikha/Pag-edit ng Lead -->
  <div class="modal-overlay" id="leadModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Bagong Lead</h2>
        <button class="close-btn" onclick="closeLeadModal()">&times;</button>
      </div>

      <div id="modalMsg" class="alert"></div>

      <form id="leadForm" onsubmit="handleFormSubmit(event)">
        <input type="hidden" id="leadId" />

        <div class="form-group">
          <label for="customerName">Pangalan ng Customer *</label>
          <input type="text" id="customerName" class="form-control" required placeholder="hal. Juan Cruz" />
        </div>

        <div class="form-group">
          <label for="contactNo">Contact Number *</label>
          <input type="text" id="contactNo" class="form-control" required placeholder="hal. 09171234567" />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" placeholder="hal. juan@gmail.com" />
        </div>

        <div class="form-group">
          <label for="carMakeModel">Tatak / Model ng Kotse</label>
          <input type="text" id="carMakeModel" class="form-control" placeholder="hal. Toyota Vios" />
        </div>

        <div class="form-group">
          <label for="plateNo">Plate Number</label>
          <input type="text" id="plateNo" class="form-control" placeholder="hal. ABC 1234" />
        </div>

        <div class="form-group">
          <label for="serviceRequested">Hinihinging Serbisyo</label>
          <input type="text" id="serviceRequested" class="form-control" placeholder="hal. Change Oil & Aircon Check" />
        </div>

        <div class="form-group">
          <label for="notes">Mga Tala / Notes</label>
          <textarea id="notes" class="form-control" rows="3" placeholder="Iba pang pahiwatig o usapan..."></textarea>
        </div>

        <button type="submit" id="btnSaveLead" class="btn-primary" style="width: 100%; margin-top: 10px;">I-save ang Lead</button>
      </form>
    </div>
  </div>

  <script>
    // Configured API Base URL
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbycl_B42BsF0dYC0l6vRpKFHnfqZb-il2k6ALl3rPWMRxERzUdKAZnAgKtkrHUS9PNjaQ/exec";

    let currentSession = null;
    let allLeads = [];
    let currentFilter = "ALL";

    window.addEventListener("DOMContentLoaded", () => {
      // Suriin ang Session Data mula sa LocalStorage
      const sessionData = localStorage.getItem("crm_user_session");
      if (!sessionData) {
        alert("Kailangan mong mag-login muna.");
        window.location.href = "login.html";
        return;
      }

      currentSession = JSON.parse(sessionData);
      document.getElementById("userInfo").textContent = `${currentSession.fullName} (${currentSession.role}) - ${currentSession.branchId}`;

      fetchLeads();
    });

    /**
     * Kumuha ng listahan ng Leads mula sa Backend API
     */
    async function fetchLeads() {
      const tableBody = document.getElementById("leadsTableBody");
      tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888;">Naglo-load ng Leads...</td></tr>`;

      try {
        const response = await fetch(API_BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "getLeads",
            branchId: currentSession.branchId
          })
        });

        const result = await response.json();
        if (result.success && Array.isArray(result.data)) {
          allLeads = result.data;
          renderLeadsTable();
        } else {
          tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Walang na-load na leads: ${result.message || ''}</td></tr>`;
        }
      } catch (err) {
        console.error("Fetch Leads Error:", err);
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Hindi makakonekta sa server.</td></tr>`;
      }
    }

    /**
     * I-render ang talahanayan ng Leads batay sa piling Status Filter
     */
    function renderLeadsTable() {
      const tableBody = document.getElementById("leadsTableBody");
      tableBody.innerHTML = "";

      const filtered = allLeads.filter(lead => {
        return currentFilter === "ALL" || String(lead.Status).toUpperCase() === currentFilter.toUpperCase();
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #888;">Walang nakitang Lead record.</td></tr>`;
        return;
      }

      filtered.forEach(lead => {
        const tr = document.createElement("tr");

        const statusClass = "badge-" + String(lead.Status).replace(/\s+/g, '_');

        tr.innerHTML = `
          <td><strong>${lead.Lead_ID || '-'}</strong></td>
          <td>${lead.Customer_Name || '-'}</td>
          <td>${lead.Contact_No || '-'}</td>
          <td>${lead.Car_Make_Model || '-'}</td>
          <td>${lead.Service_Requested || '-'}</td>
          <td>
            <select class="status-select" onchange="changeStatus('${lead.Lead_ID}', this.value)">
              <option value="New" ${lead.Status === 'New' ? 'selected' : ''}>New</option>
              <option value="In Progress" ${lead.Status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Converted" ${lead.Status === 'Converted' ? 'selected' : ''}>Converted</option>
              <option value="Closed" ${lead.Status === 'Closed' ? 'selected' : ''}>Closed</option>
            </select>
          </td>
          <td>
            <button style="padding: 4px 8px; cursor: pointer;" onclick="openEditModal('${lead.Lead_ID}')">Edit</button>
          </td>
        `;

        tableBody.appendChild(tr);
      });
    }

    /**
     * Mabilisang pagpalit ng Status
     */
    async function changeStatus(leadId, newStatus) {
      try {
        const response = await fetch(API_BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "updateLeadStatus",
            leadId: leadId,
            newStatus: newStatus
          })
        });

        const result = await response.json();
        if (result.success) {
          fetchLeads(); // I-refresh ang listahan
        } else {
          alert("Bigo sa pagpalit ng status: " + result.message);
        }
      } catch (err) {
        alert("Error sa pakikipag-ugnayan sa server.");
      }
    }

    /**
     * Filter tab switching
     */
    function filterTab(status, element) {
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      element.classList.add("active");
      currentFilter = status;
      renderLeadsTable();
    }

    /**
     * Modal Control Helpers
     */
    function openLeadModal() {
      document.getElementById("leadForm").reset();
      document.getElementById("leadId").value = "";
      document.getElementById("modalTitle").textContent = "Bagong Lead";
      document.getElementById("leadModal").style.display = "flex";
    }

    function openEditModal(leadId) {
      const lead = allLeads.find(l => l.Lead_ID === leadId);
      if (!lead) return;

      document.getElementById("leadId").value = lead.Lead_ID;
      document.getElementById("customerName").value = lead.Customer_Name || "";
      document.getElementById("contactNo").value = lead.Contact_No || "";
      document.getElementById("email").value = lead.Email || "";
      document.getElementById("carMakeModel").value = lead.Car_Make_Model || "";
      document.getElementById("plateNo").value = lead.Plate_No || "";
      document.getElementById("serviceRequested").value = lead.Service_Requested || "";
      document.getElementById("notes").value = lead.Notes || "";

      document.getElementById("modalTitle").textContent = "I-edit ang Lead " + leadId;
      document.getElementById("leadModal").style.display = "flex";
    }

    function closeLeadModal() {
      document.getElementById("leadModal").style.display = "none";
    }

    /**
     * Form Submission (Create or Update)
     */
    async function handleFormSubmit(event) {
      event.preventDefault();

      const leadId = document.getElementById("leadId").value;
      const btnSave = document.getElementById("btnSaveLead");
      btnSave.disabled = true;
      btnSave.textContent = "Isina-save...";

      const payload = {
        action: leadId ? "updateLead" : "createLead",
        leadId: leadId,
        customerName: document.getElementById("customerName").value,
        contactNo: document.getElementById("contactNo").value,
        email: document.getElementById("email").value,
        carMakeModel: document.getElementById("carMakeModel").value,
        plateNo: document.getElementById("plateNo").value,
        serviceRequested: document.getElementById("serviceRequested").value,
        notes: document.getElementById("notes").value,
        branchId: currentSession.branchId,
        assignedPm: currentSession.fullName
      };

      try {
        const response = await fetch(API_BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.success) {
          closeLeadModal();
          fetchLeads();
        } else {
          alert("Error: " + result.message);
        }
      } catch (err) {
        alert("Bigo sa pag-save ng lead.");
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = "I-save ang Lead";
      }
    }
  </script>
</body>
</html>
