<script>
    // Live Google Apps Script Executable URL
    const API_BASE_URL = "https://script.google.com/macros/s/AKfycbycl_B42BsF0dYC0l6vRpKFHnfqZb-il2k6ALl3rPWMRxERzUdKAZnAgKtkrHUS9PNjaQ/exec";

    async function handleLogin(event) {
      event.preventDefault();
      
      const emailInput = document.getElementById("email").value;
      const passwordInput = document.getElementById("password").value;
      const errorMsg = document.getElementById("errorMsg");
      const btnLogin = document.getElementById("btnLogin");

      errorMsg.style.display = "none";
      btnLogin.disabled = true;
      btnLogin.textContent = "Nagmemecheck ng account...";

      try {
        const response = await fetch(API_BASE_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "login",
            email: emailInput,
            password: passwordInput
          })
        });

        const result = await response.json();

        if (result.success && result.data) {
          // I-save ang user session sa LocalStorage
          localStorage.setItem("crm_user_session", JSON.stringify(result.data));

          // Role-based Redirection
          const role = String(result.data.role).toLowerCase();
          
          if (role === "pm" || role === "page manager") {
            window.location.href = "pmDashboardView.html";
          } else if (role === "sa" || role === "service advisor") {
            window.location.href = "saDashboardView.html";
          } else {
            // Default fallback
            window.location.href = "pmDashboardView.html";
          }
        } else {
          errorMsg.textContent = result.message || "Maling email o password.";
          errorMsg.style.display = "block";
        }
      } catch (err) {
        console.error("Login Error:", err);
        errorMsg.textContent = "Hindi makakonekta sa server. Pakisuri ang koneksyon.";
        errorMsg.style.display = "block";
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Mag-login";
      }
    }
  </script>
